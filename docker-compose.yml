services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: docvalidator
      POSTGRES_USER: docvalidator
      POSTGRES_PASSWORD: docvalidator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/docvalidator
      IA_PROVIDER: ${IA_PROVIDER:-regex}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  pgdata:
