server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Padrão: H2 em arquivo (zero configuração). Para PostgreSQL: --spring.profiles.active=postgres
  datasource:
    url: jdbc:h2:file:./data/docvalidator;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  ocr:
    # Linux (apt): /usr/share/tesseract-ocr/5/tessdata  |  macOS (brew): /opt/homebrew/share/tessdata
    # Windows: pasta tessdata dentro da instalação do Tesseract
    tessdata-path: ${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
    language: por
  ia:
    # regex (sem IA, padrão) | openai | anthropic
    provider: ${IA_PROVIDER:regex}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docvalidator}
    username: ${DB_USER:docvalidator}
    password: ${DB_PASSWORD:docvalidator}
